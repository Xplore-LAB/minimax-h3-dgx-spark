name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser and downloader dependencies
        run: python -m pip install 'safetensors>=0.5,<1' 'huggingface_hub>=0.34,<2'
      - name: Check shell syntax
        run: bash -n scripts/verify_models.sh scripts/common.sh
      - name: Run offline model integrity regressions
        run: python -m unittest discover -s tests -v
